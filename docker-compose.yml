services:
  voxscribe:
    build: .
    container_name: voxscribe
    ports:
      - "7860:7860"
    environment:
      OUTPUT_DIR: /outputs
      VOXSCRIBE_DISABLE_NNPACK: "true"
    volumes:
      - ./outputs:/outputs
    restart: unless-stopped

  voxscribe-gpu:
    build: .
    container_name: voxscribe-gpu
    profiles: ["gpu"]
    ports:
      - "7860:7860"
    environment:
      OUTPUT_DIR: /outputs
      VOXSCRIBE_DISABLE_NNPACK: "true"
    volumes:
      - ./outputs:/outputs
    gpus: all
    restart: unless-stopped
